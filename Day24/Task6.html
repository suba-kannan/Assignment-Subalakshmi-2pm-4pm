<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h3>Number Validation</h3>
    <input id="num" placeholder="Enter a number" />
    <button onclick="checkNumber()">Check</button>
    <p id="result"></p>
    <script>
      function checkNumber() {
        try {
          let value = document.getElementById("num").value;

          if (value === "") throw "Input is empty";
          if (isNaN(value)) throw "Not a number";

          document.getElementById("result").innerText = "Valid Number";
        } catch (err) {
          document.getElementById("result").innerText = "Error: " + err;
        }
      }
    </script>
  </body>
</html>
