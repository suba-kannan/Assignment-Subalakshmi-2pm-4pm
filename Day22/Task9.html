<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button class="colorBtn" data-color="lightblue">blue</button>
    <button class="colorBtn" data-color="lightgreen">Green</button>
    <button class="colorBtn" data-color="pink">Pink</button>
    <script>
      let buttons = document.querySelectorAll(".colorBtn");
      buttons.forEach((btn) => {
        btn.addEventListener("click", () => {
          document.body.style.backgroundColor = btn.dataset.color;
        });
      });
    </script>
  </body>
</html>
